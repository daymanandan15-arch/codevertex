{% extends "base.html" %}

{% block title %}Add Resource | Resource Hub{% endblock %}

{% block content %}
<div class="auth-container" style="max-width: 600px; margin: 0 auto;">
    <div class="auth-box card">
        <div class="auth-header">
            <h2>Add to the Hub</h2>
            <p class="auth-subtitle">Help the community by submitting high-quality engineering content.</p>
        </div>

        <form action="{{ url_for('views.resources_add_resource') }}" method="POST">
            <div class="form-group">
                <label for="title">Title / Course Name</label>
                <input type="text" id="title" name="title" class="form-control"
                    placeholder="e.g., CS50 Intro to Computer Science" required>
            </div>

            <div class="form-group">
                <label for="url">Direct URL</label>
                <input type="url" id="url" name="url" class="form-control" placeholder="https://..." required>
            </div>

            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                    <label for="type">Material Type</label>
                    <select id="type" name="type" class="form-control"
                        style="background: var(--bg-primary); color: white; border: 1px solid var(--border);" required>
                        <option value="Course">Course</option>
                        <option value="YouTube">YouTube Playlist</option>
                        <option value="GitHub Repo">GitHub Repo</option>
                        <option value="Article">Long-form Article</option>
                        <option value="Book">Book / PDF</option>
                    </select>
                </div>
                <div>
                    <label for="tags">Tags (comma separated)</label>
                    <input type="text" id="tags" name="tags" class="form-control" placeholder="python, design patterns">
                </div>
            </div>

            <div class="form-group" style="margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Resource</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
